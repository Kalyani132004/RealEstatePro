; /etc/supervisor/conf.d/realestatepro-worker.conf
; Install: sudo apt install supervisor
; Apply:   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start realestatepro-worker:*

[program:realestatepro-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/realestatepro/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/realestatepro
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/realestatepro/storage/logs/worker.log
stopwaitsecs=3600
