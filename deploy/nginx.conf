# /etc/nginx/sites-available/realestatepro
# Symlink to sites-enabled: sudo ln -s /etc/nginx/sites-available/realestatepro /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name realestatepro.com www.realestatepro.com;

    # Let's Encrypt / ACM handles the redirect to HTTPS in production;
    # this block stays for the ACME HTTP-01 challenge + plain HTTP fallback.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realestatepro.com www.realestatepro.com;

    root /var/www/realestatepro/public;
    index index.php index.html;

    # SSL certs — via Certbot (see Phase 20 guide) or an ACM cert on an
    # attached Application Load Balancer instead of terminating TLS here.
    ssl_certificate     /etc/letsencrypt/live/realestatepro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realestatepro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;
    client_max_body_size 110M; # accommodate the 100MB video upload limit (Phase 17) + headroom

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache static assets (Bootstrap/theme.css/JS all served from public/assets)
    location ~* \.(css|js|jpg|jpeg|png|webp|gif|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300; # generous timeout for chunked video finalization (Phase 17)
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/realestatepro-access.log;
    error_log  /var/log/nginx/realestatepro-error.log;
}
